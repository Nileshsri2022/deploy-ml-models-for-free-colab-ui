[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    e2e: end-to-end tests that drive a real agent over the relay websocket
    slow: tests that sleep or wait on timeouts
filterwarnings =
    ignore::DeprecationWarning
    ignore::starlette.testclient.StarletteDeprecationWarning
